name: Build & Release Android APK

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Web Bundle & Sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuestAscend-RPG.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuestAscend-Android-APK
          path: QuestAscend-RPG.apk

      - name: Publish Android APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "QuestAscend RPG v1.0.0 - Android Release"
          body: "Official Android APK build for QuestAscend RPG GATE CS platform."
          files: QuestAscend-RPG.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
